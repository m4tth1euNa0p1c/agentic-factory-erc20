# Runs the TELA agentic factory in CI when the repository OWNER comments `/factory <spec>` on an issue or PR.
# Guard rails (review of 2026-11-08):
#  - ANTHROPIC_API_KEY is an ENVIRONMENT secret of `factory`, which only accepts the `main` branch;
#  - `main` is protected server-side (PR required, 9 required checks, admins included, no force-push):
#    the agent can only push spec branches and open PRs, never change main directly;
#  - single concurrent run, bounded time and turns.
name: factory
on:
  issue_comment: { types: [created] }
  workflow_dispatch:
    inputs:
      spec: { description: "Spec number (e.g. 002)", required: true }

permissions:
  contents: write        # push spec branches only (main rejects direct pushes)
  issues: write
  pull-requests: write
  id-token: write        # required by claude-code-action authentication

concurrency: { group: factory, cancel-in-progress: false }

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/factory') && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    environment: factory
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the skill `factory-run` for spec ${{ github.event.inputs.spec || github.event.comment.body }}.
            Follow CLAUDE.md and .specify/memory/constitution.md strictly. Never read .env or the secrets directory.
            Work on the spec branch only and deliver through a pull request; never push to main.
          claude_args: "--max-turns 80"
