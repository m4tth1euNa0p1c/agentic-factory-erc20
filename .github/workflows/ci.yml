name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  factory-guard:
    name: factory hooks tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: node .claude/hooks/guard.test.mjs
      - run: node .claude/hooks/perimeter-guard.test.mjs
      - name: knowledge base (lint self-test + lint + golden Q&A)
        run: |
          node .claude/hooks/knowledge-curator-guard.test.mjs
          node scripts/knowledge-lint.test.mjs
          node scripts/knowledge-lint.mjs
          node scripts/knowledge-eval.mjs --min 1
      - name: security-audit skill validators
        run: |
          node --test .claude/skills/security-audit/validate-findings.test.cjs .claude/skills/security-audit/validate-coverage-ledger.test.cjs

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  trivy:
    name: trivy (config + deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --exit-code 1 --offline-scan --ignorefile /repo/.trivyignore \
            --skip-dirs /repo/contracts/lib /repo

  contracts:
    name: contracts (forge + slither)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - run: scripts/forge.sh test -vv
      - run: scripts/forge.sh coverage --report summary --no-match-coverage "(test|script|lib)/"
      - run: scripts/slither.sh ci/slither
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: slither, path: evidence/ci/slither }

  sandbox-e2e:
    name: sandbox e2e (001)
    needs: [contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - run: scripts/bootstrap-env.sh
      - run: scripts/sandbox.sh up
      - run: scripts/deploy-contracts.sh
      - run: tests/e2e/run.sh 001-contracts
      - run: scripts/sandbox.sh check
      - if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: evidence-001, path: evidence/001 }

  adapter:
    name: adapter (typecheck + vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: adapter

  indexer:
    name: indexer (typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm ci --no-audit --no-fund && npx tsc
        working-directory: indexer

  backend:
    name: backend (Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "25", cache: maven }
      - run: ./mvnw -B -ntp verify
        working-directory: backend

  frontend:
    name: frontend (unit tests + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm ci --no-audit --no-fund && npx ng test --no-watch && npx ng build
        working-directory: frontend

  e2e-002:
    name: e2e 002 (full stack, 4 scenarios)
    needs: [contracts, adapter, backend, indexer]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - run: scripts/bootstrap-env.sh && scripts/sandbox.sh up && scripts/deploy-contracts.sh
      # explicit services: --wait reports the one-shot kafka-init (exit 0) as a failure otherwise
      - run: docker compose --profile app build && docker compose --profile app up -d --wait indexer backend adapter frontend
      - run: tests/e2e/run.sh nominal
      - run: tests/e2e/run.sh restart-after-broadcast
      - run: tests/e2e/run.sh ponder-lag
      - run: tests/e2e/run.sh failure-vs-unknown
      - if: failure()
        run: docker compose --profile app logs --tail=300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: evidence-002, path: evidence/002 }
