spring:
  application.name: tela-backend
  threads.virtual.enabled: true
  datasource:
    url: ${BACKEND_DATABASE_URL:jdbc:postgresql://localhost:5432/tela}
    username: ${BACKEND_DB_USER:tela_backend}
    password: ${BACKEND_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      connection-init-sql: SET search_path TO backend
  flyway:
    schemas: backend
    default-schema: backend
    create-schemas: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: tela-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mvc.problemdetails.enabled: true

server:
  port: 8080
  error.include-message: never

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

tela:
  commands-topic: tela.operations.commands.v1
  results-topic: tela.operations.results.v1
  reconcile-after: ${TELA_RECONCILE_AFTER:30s}
  relay-batch-size: 100
