openapi: 3.1.0
info:
  title: TELA Operations API
  version: 1.0.0
  description: Spec 002. Amounts are integer strings in token minimal units (6 decimals, H-02).
servers: [{ url: http://127.0.0.1:8080 }]
paths:
  /api/v1/transfers:
    post:
      operationId: createTransfer
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "200": { description: Replay of an existing Idempotency-Key, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      parameters: [{ name: operationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{operationId}/transitions:
    get:
      operationId: getTransitions
      description: Observed transitions only; intermediate statuses are optional (D-14).
      parameters: [{ name: operationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transition" } } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/system/indexer-status:
    get:
      operationId: getIndexerStatus
      description: Indexing freshness (spec 005 US1). `regressed` = indexed head below the highest head ever seen (D-23).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IndexerStatus" } } } }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/operations:
    get:
      operationId: listOperations
      parameters:
        - { name: account, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Operation" } } } } }
  /api/v1/accounts/{address}/balances:
    get:
      operationId: getBalances
      parameters: [{ name: address, in: path, required: true, schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Balance" } } } } }
components:
  responses:
    Problem:
      description: RFC 9457 problem
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Token: { type: string, enum: [TCE, TCD, TIF] }
    Status: { type: string, enum: [RECEIVED, PUBLISHED, BROADCAST, UNKNOWN, CONFIRMED, SETTLED, FAILED, REJECTED] }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [from, to, token, amount]
      properties:
        from: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        to: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        token: { $ref: "#/components/schemas/Token" }
        amount: { type: string, pattern: "^[1-9][0-9]{0,77}$" }
    Operation:
      type: object
      required: [operationId, type, from, to, token, amount, status, reference, createdAt, updatedAt]
      properties:
        operationId: { type: string, format: uuid }
        type: { type: string, enum: [TRANSFER] }
        from: { type: string }
        to: { type: string }
        token: { $ref: "#/components/schemas/Token" }
        amount: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        txHash: { type: [string, "null"] }
        blockNumber: { type: [string, "null"] }
        failureReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Balance:
      type: object
      required: [token, indexed, pending, available, availableRaw, heldTotal, indexedAtBlock]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        indexed: { type: string, description: "balance indexed by Ponder" }
        pending: { type: string, description: "HELD reservations whose execution is not indexed yet" }
        available: { type: string, description: "what may still be reserved (display value, clamped at 0)" }
        availableRaw: { type: string, description: "indexed - pending, unclamped; invariant >= 0 (diagnostic)" }
        heldTotal: { type: string, description: "all HELD reservations, incl. executions indexed but not yet settled" }
        indexedAtBlock: { type: [string, "null"] }
    Transition:
      type: object
      required: [to, source, at]
      properties:
        from: { type: [string, "null"] }
        to: { $ref: "#/components/schemas/Status" }
        source: { type: string, enum: [api, outbox, adapter, indexer] }
        at: { type: string, format: date-time }
    IndexerStatus:
      type: object
      required: [regressed]
      properties:
        indexedBlock: { type: [string, "null"] }
        indexedBlockTimestamp: { type: [string, "null"], description: "unix seconds of the last indexed block" }
        watermark: { type: [string, "null"] }
        regressed: { type: boolean }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, enum: [INSUFFICIENT_AVAILABLE, INVALID_REQUEST, IDEMPOTENCY_CONFLICT, NOT_FOUND, UNKNOWN_TOKEN, INDEXER_UNAVAILABLE] }
        detail: { type: string }
        available: { type: string }
