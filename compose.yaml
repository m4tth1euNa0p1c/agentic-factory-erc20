# TELA sandbox — spec 001. Start with: scripts/sandbox.sh up
# Security: every published port is bound to 127.0.0.1; Web3Signer is never published.
name: ${COMPOSE_PROJECT_NAME:-tela}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  chain:    {}   # besu <-> web3signer/adapter/indexer
  signing:  { internal: true }   # web3signer <-> adapter (+ one-shot deployer)
  data:     {}   # postgres <-> backend/indexer/adapter
  bus:      {}   # kafka <-> backend/adapter

volumes:
  besu-data: {}
  pg-data: {}
  kafka-data: {}

services:
  besu:
    <<: *hardening
    image: hyperledger/besu:26.11.0
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/secrets/key
      - --data-path=/var/lib/besu
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL,QBFT
      - --host-allowlist=besu,localhost,127.0.0.1
      - --p2p-host=0.0.0.0
      - --logging=INFO
    volumes:
      - ./infra/generated/besu/genesis.json:/config/genesis.json:ro
      - ./infra/.secrets/besu/key:/secrets/key:ro
      - besu-data:/var/lib/besu
    ports: ["127.0.0.1:8545:8545"]
    networks: [chain]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545 && printf \"GET /liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30

  web3signer:
    <<: *hardening
    image: consensys/web3signer:26.10.2
    command:
      - --key-store-path=/var/lib/web3signer/keys
      - --http-listen-host=0.0.0.0
      - --http-listen-port=9000
      - --http-host-allowlist=web3signer,localhost
      - --logging=INFO
      - eth1
      - --chain-id=${TELA_CHAIN_ID}
      - --downstream-http-host=besu
      - --downstream-http-port=8545
      - --downstream-http-request-timeout=10000
    volumes:
      - ./infra/.secrets/web3signer:/var/lib/web3signer:ro
    networks: [chain, signing]
    depends_on: { besu: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /upcheck HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q OK <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    <<: *hardening
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: tela_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: tela
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD}
      PONDER_DB_PASSWORD: ${PONDER_DB_PASSWORD}
      ADAPTER_DB_PASSWORD: ${ADAPTER_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tela_admin -d tela"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    <<: *hardening
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ["127.0.0.1:29092:29092"]
    networks: [bus]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.4.0
    security_opt: ["no-new-privileges:true"]
    depends_on: { kafka: { condition: service_healthy } }
    networks: [bus]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in tela.operations.commands.v1 tela.operations.results.v1 tela.operations.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 6 --replication-factor 1 --config min.insync.replicas=1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
