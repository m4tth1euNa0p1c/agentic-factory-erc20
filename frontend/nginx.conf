# Review #28 finding 1 (DNS rebinding): only known Host values are served; anything else gets 421.
server_tokens off;

server {
  listen 8080 default_server;
  server_name _;
  return 421;
}

server {
  listen 8080;
  # localhost/127.0.0.1 = operator on the host (port bound to 127.0.0.1); frontend = compose service name (e2e)
  server_name localhost 127.0.0.1 frontend;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # API TELA : seul point d'accès réseau de l'interface (aucun appel direct Besu/Web3Signer/Kafka).
  location /api/ {
    # Résolution à l'exécution (DNS Docker) : nginx démarre même si le backend n'est pas encore là.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
    # add_header n'est pas hérité dès qu'un bloc en définit un : on le répète ici.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
  }
}
