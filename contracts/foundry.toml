[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
offline = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512
seed = "0x7e1a"

[invariant]
runs = 64
depth = 32
fail_on_revert = false
